name: review-council

on:
  push:
    branches: [main]
    paths:
      - 'tools/review-council/**'
      - 'review-council/**'
      - 'docs/review-council/**'
      - '.github/workflows/review-council.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'tools/review-council/**'
      - 'review-council/**'
      - 'docs/review-council/**'
      - '.github/workflows/review-council.yml'
      - '.gitignore'

permissions:
  contents: read

jobs:
  review-council-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Review council tests (race)
        run: go test -race ./tools/review-council
      - name: Review council vet
        run: go vet ./tools/review-council
      - name: Review council build
        run: go build ./tools/review-council
