# CI is the quality floor (BC-2, ENGINEERING_STANDARD): every job here is
# merge-blocking. V2-TST-016: production deployment is blocked when release-
# gating checks are missing or red.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# BX-MED-015: least privilege by default. No job in this workflow writes to the
# repository; the supply-chain jobs below only read. Any future job that needs
# more must declare it locally, where a reviewer will see it.
permissions:
  contents: read

jobs:
  quality:
    # Static quality floor — no database needed, fails fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt clean (BC-2)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go mod verify + tidy diff-clean (BC-2 supply chain)
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: No floats in the money or scoring path (BC-1 guard)
        run: |
          if grep -rEn 'float(32|64)' backend/internal/entity backend/internal/ledger backend/internal/scoring 2>/dev/null; then
            echo "float in money/scoring path — forbidden by ADR-0002 / BC-1"; exit 1
          fi
          echo "money and scoring paths float-free"

      - name: golangci-lint (BC-2 — zero warnings)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # BX-MED-015: pinned, not `latest`. The v2 line is REQUIRED by
          # .golangci.yml (`version: "2"`). v2.12.2 is what `latest` resolved to
          # when this was pinned, so the pin reproduces the then-green run.
          # Bump deliberately, never silently.
          version: v2.12.2

      - name: govulncheck (BC-2 — Go vulnerability DB)
        run: |
          # BX-MED-015: the SCANNER is pinned; the vulnerability DATABASE is not
          # and must not be — govulncheck queries vuln.go.dev live, so CI can go
          # red on a day nothing changed. That is the gate working, not a flake.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -version
          govulncheck ./...

      - name: gosec (BC-2 — security static analysis)
        run: |
          # BX-MED-015: pinned, so new rules cannot land under our feet mid-PR.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -version
          gosec -quiet -exclude-generated ./...

      - name: Vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: OpenAPI spec validation (V2-API-001)
        run: go test -count=1 ./api/...

  # BX-MED-015: merge-blocking secret scan. Deliberately a self-contained pinned
  # BINARY rather than gitleaks-action: this pins the exact bytes (checksum), not
  # just a commit, and makes no licence-server call from inside a supply-chain
  # gate (gitleaks-action requires a licence for organisation-owned repos).
  #
  # This job installs NOTHING else, on purpose — no `npm ci`, no `go build`. A
  # bare checkout means node_modules/ and .next/ do not exist, so vendored
  # third-party JS can never produce a finding. Do not add install steps here.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks (pinned version + verified checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: gitleaks — no credentials in the tree (merge-blocking)
        run: |
          set -euo pipefail
          # --redact is MANDATORY, not cosmetic: this repository is PUBLIC, so
          # build logs are public. An unredacted finding would broadcast the very
          # secret the scan just caught.
          /tmp/gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

  # BX-MED-015: dependency review — flags advisories in what a PR ADDS.
  #
  # NOT redundant with govulncheck: govulncheck is reachability-based, so a newly
  # added dependency carrying a known advisory that nothing calls yet is invisible
  # to it. This job flags the dependency itself.
  #
  # HONEST LIMITATION: the action only works on pull_request events (it diffs the
  # PR's base against its head), so it does not run on direct pushes to main.
  # It is merge-blocking for the PR path; SBOM + provenance + artifact signing
  # remain staged for production certification, per the audit.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependency review (merge-blocking on PRs)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: devlocal
          POSTGRES_DB: telco_credit
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fresh-DB migration check (from-zero lesson)
        env:
          TCP_ADMIN_DSN: postgres://postgres:devlocal@localhost:5434/telco_credit
        run: go run ./backend/cmd/migrate

      # V2-TST-016: merge is blocked when this job fails. Includes the SF-3
      # tenant-isolation negative pack (fresh databases per test package) and
      # the G0-F2 reviewer reproducer.
      #
      # -p 2 bounds package-level parallelism: the DB-heavy packages share ONE
      # Postgres, and the default (GOMAXPROCS) run starved it enough that a
      # package could hit the 10-min timeout under load (a non-deterministic
      # FAIL that looked like a coverage dip because a timed-out package's
      # coverage was lost). -race reports fire regardless of -p, so bounding
      # parallelism removes the starvation without masking any real race. The
      # reviewer confirmed 22/22 packages green, exit 0, under -p 2.
      - name: Race-enabled test suite with coverage
        env:
          CI: "true"
          TCP_TEST_HOSTPORT: localhost:5434
        run: >
          go test -race -count=1 -p 2
          -coverprofile=coverage.out
          -coverpkg=./backend/internal/...
          ./backend/... ./simulator/...

      - name: Coverage floor 70% on backend/internal (BC-2 — ratchets up, never down)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 70.0) { print "coverage " t "% below floor 70%"; exit 1 } }'

      # Serial by design: reshapes cluster-global roles to prove the managed-
      # Postgres deployment path (non-superuser owner, BYPASSRLS fallback,
      # env password rotation). Runs AFTER the parallel suite so it cannot
      # race other packages' role authentication.
      - name: Managed-owner migration path (Render class, serial)
        env:
          TCP_TEST_HOSTPORT: localhost:5434
          TCP_TEST_MANAGED_OWNER: "1"
        run: go test -count=1 -run TestApply_AsManagedNonSuperuserOwner ./backend/internal/platform/dbmigrate/

  # Gate B #3: the operator portal is now merge-blocking too — a red typecheck,
  # lint, build, or a missing/weakened browser security header fails the PR
  # (VR-56-F1: the CSP is the console's XSS defence for the CSRF-token session).
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (next lint — zero warnings)
        run: npm run lint

      - name: Build
        run: npm run build

      # Prove the security headers are actually SERVED (not just declared), that
      # the CSP is the strict nonce form (NOT weakened 'unsafe-inline'), and
      # (VR-62-F1) that the app actually LOADS under its own CSP: every same-origin
      # script in the served HTML must carry THIS request's nonce. A static-
      # prerender regression (e.g. dropping `await headers()` from layout.tsx, or a
      # Next upgrade changing prerender behaviour) ships nonce-less scripts that
      # strict-dynamic then blocks (white screen) while the header stays strict —
      # this is the check that catches that, not the header assertion.
      - name: Security headers + strict CSP + app loads under its own CSP
        run: |
          npm run start >/tmp/portal.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:3090/login" && break || sleep 1
          done
          # One request: headers AND body share the same per-request nonce.
          body=$(curl -sD /tmp/hdr.txt "http://localhost:3090/login")
          h=$(cat /tmp/hdr.txt)
          echo "$h"
          fail=0
          req() { echo "$h" | grep -iq "$1" || { echo "MISSING header: $1"; fail=1; }; }
          req "^content-security-policy:"
          req "^strict-transport-security: *max-age=63072000"
          req "^x-frame-options: *DENY"
          req "^x-content-type-options: *nosniff"
          req "^referrer-policy: *no-referrer"
          req "^permissions-policy:"
          csp=$(echo "$h" | grep -i "^content-security-policy:")
          nonce=$(echo "$csp" | grep -oE "nonce-[A-Za-z0-9+/=]+" | head -1 | sed "s/nonce-//")
          [ -n "$nonce" ] || { echo "CSP is not nonce-based"; fail=1; }
          if echo "$csp" | grep -oiE "script-src[^;]*" | grep -q "unsafe-inline"; then
            echo "CSP script-src permits unsafe-inline — XSS defence defeated"; fail=1
          fi
          # VR-62-F1: the app-loads-under-CSP regression guard.
          nonced=$(echo "$body" | grep -oE "<script[^>]*nonce=\"${nonce}\"" | wc -l)
          scripts=$(echo "$body" | grep -oE "<script( [^>]*)?>" | wc -l)
          unnonced=$(echo "$body" | grep -oE "<script( [^>]*)?>" | grep -cv "nonce=" || true)
          echo "scripts total=${scripts} nonced=${nonced} un-nonced=${unnonced}"
          [ "$nonced" -ge 1 ] || { echo "NO script carries the request nonce — CSP would block the app (white screen)"; fail=1; }
          [ "$unnonced" -eq 0 ] || { echo "${unnonced} same-origin scripts lack the nonce — strict-dynamic would block them"; fail=1; }
          exit $fail

  # Gate B #3 Slice B: portal RBAC-scope journeys against the REAL stack (Go API +
  # seeded Postgres + the built portal). Server-side role×route RBAC is already
  # exhaustively unit-tested in Go; this proves the BROWSER story — per-role nav,
  # out-of-role route refusal, and the scope indicator — end to end, merge-blocking.
  portal-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: devlocal
          POSTGRES_DB: telco_credit
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TCP_ADMIN_DSN: postgres://postgres:devlocal@localhost:5434/telco_credit
      # CI test operators (ephemeral DB fixtures, not secrets — same idea as the
      # roleKeys in portal_test.go). One JSON list drives BOTH the seed tool and
      # the Playwright keys so they can never drift.
      E2E_OPERATORS: '[{"actor":"e2e_admin","key":"e2e-key-admin-00000001","role":"ADMIN","scope":"*"},{"actor":"e2e_risk","key":"e2e-key-risk-000000001","role":"RISK","scope":"*"},{"actor":"e2e_finance","key":"e2e-key-fin-0000000001","role":"FINANCE","scope":"*"},{"actor":"e2e_ops","key":"e2e-key-ops-0000000001","role":"OPS","scope":"*"},{"actor":"e2e_support","key":"e2e-key-sup-0000000001","role":"SUPPORT","scope":"*"},{"actor":"e2e_fin_scoped","key":"e2e-key-finscoped-0001","role":"FINANCE","scope":"telco:SIM_NG"}]'
      PORTAL_E2E_KEYS: '{"ADMIN":"e2e-key-admin-00000001","RISK":"e2e-key-risk-000000001","FINANCE":"e2e-key-fin-0000000001","OPS":"e2e-key-ops-0000000001","SUPPORT":"e2e-key-sup-0000000001","FINANCE_SCOPED":"e2e-key-finscoped-0001"}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Migrate the database
        run: go run ./backend/cmd/migrate

      - name: Seed CI operators (one per role + a telco-scoped one)
        env:
          TCP_SEED_ALLOW: "1"
          TCP_SEED_OPERATORS: ${{ env.E2E_OPERATORS }}
        run: go run ./backend/cmd/seed-operators

      - name: Build + start the API
        run: |
          # BX-MED-005: stamp build identity so /version reports the REAL commit, not "unknown".
          go build -ldflags "-X github.com/ArowuTest/telco-credit-platform/backend/internal/platform/buildinfo.Commit=${GITHUB_SHA}" -o /tmp/tcp-api ./backend/cmd/api
          /tmp/tcp-api >/tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://localhost:8090/healthz" && { echo "api ready"; break; }
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:8090/healthz" || { echo "API failed to boot:"; cat /tmp/api.log; exit 1; }

      - name: Portal deps + build
        working-directory: portal
        run: |
          npm ci
          npm run build

      - name: Install Playwright (chromium)
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Start portal + run RBAC-scope journeys
        working-directory: portal
        env:
          BX_API_ORIGIN: http://localhost:8090
        run: |
          npm run start >/tmp/portal.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:3090/login" && { echo "portal ready"; break; }
            sleep 1
          done
          curl -sf -o /dev/null "http://localhost:3090/login" || { echo "portal failed to boot:"; cat /tmp/portal.log; exit 1; }
          npm run test:e2e
